# 民商事案件评估规则库（检索注入提示词；不构成法律意见，须执业律师复核）
entries:
  - id: burden_of_proof
    keywords: [举证, 证据, 证明责任, 谁主张]
    text: 举证责任："谁主张谁举证"；特殊侵权情形举证责任倒置（如产品/医疗/环境）。
      评估时先列要件事实清单，再逐项核对现有证据能否支撑（民事案件证据规定）。
  - id: proof_standard
    keywords: [高度盖然性, 证明标准, 证据链, 相互印证]
    text: 证明标准为"高度盖然性"：证据链需相互印证形成完整闭环；仅有单一转账
      凭证而无借贷合意证据（借条/聊天记录）的，要件事实不完整，属关键证据缺口。
  - id: evidence_form
    keywords: [原件, 电子数据, 转账, 聊天记录, 复印件]
    text: 证据形式：书证须提交原件（复印件证明力弱，对方不认可则难以采信）；
      电子数据（微信记录/转账凭证）须保留载体完整并可出示原始记录。
  - id: limitation_3y
    keywords: [时效, 三年, 188, 时效中断, 时效抗辩]
    text: 诉讼时效（《民法典》第 188 条）：普通时效 3 年，自知道权利受损及义务人
      起算；期间催款/对方承诺还款构成中断并重新起算；时效届满后起诉的，对方
      提出抗辩则丧失胜诉权——评估时必须核对最后一次主张时间。
  - id: labor_arbitration
    keywords: [劳动, 仲裁, 前置, 一年, 解除, 工资]
    text: 劳动争议：仲裁前置（《劳动争议调解仲裁法》），仲裁时效 1 年（第 27 条），
      拖欠工资时效特殊（劳动关系存续期间不受限）；口头辞退举证困难，
      需微信/录音/证人佐证解除事实。
  - id: preservation
    keywords: [保全, 财产, 冻结, 转移]
    text: 财产保全：诉前/诉中保全（民诉法保全条款）可冻结对方账户房产防止转移；
      须提供担保（诉前必须）；对方失联或有转移迹象时建议列为首选策略。
  - id: service_by_publication
    keywords: [公告送达, 失联, 缺席]
    text: 公告送达：被告失联时法院可公告送达（国内公告期 30 日），期满缺席判决；
      公告期间拉长周期约 2-3 个月，评估时效与成本时应计入。
  - id: cost_benefit
    keywords: [诉讼费, 成本, 调解, 和解, 标的额]
    text: 成本收益：诉讼费按标的额阶梯收取（100 万标的约 1.38 万元一审），可与
      保全费/律师费一并主张由败诉方负担的比例；小额纠纷建议先调解/支付令
      （成本十分之一量级）。
