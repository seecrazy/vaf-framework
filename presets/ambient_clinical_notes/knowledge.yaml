entries:
  - id: soap_structure
    keywords: [SOAP, 主诉, 现病史, 查体, 评估, 计划, 笔记]
    text: SOAP 结构：S=患者视角主诉与现病史（发病时间/性质/加重缓解因素）；
      O=客观所见（查体/生命体征/检查，只记录实际获得的数据）；A=评估判断；
      P=计划（检查/治疗/宣教/随访）。四段不得混写。
  - id: no_inference
    keywords: [编造, 推演, 补全, 逐字, 口述]
    text: 不得推演原则：Assessment 与 Plan 只能逐字整理医生口述；对话中医生
      未说的判断、未开的处方一律不得出现——环境记录是"记录"不是"诊疗"。
  - id: pii_policy
    keywords: [敏感, 脱敏, 电话, 身份证, 隐私]
    text: 隐私处理：患者电话/证件号等 PII 在进入提示词前已按敏感级掩码，
      笔记保留掩码形式；确需联系方式的由医生在签核时自行补录。
  - id: quality_flags
    keywords: [缺失, 质量, objective, 不良]
    text: 质量标记：客观段无数据、对话噪音过多、患者叙述与医生复述矛盾——
      逐条写 quality_flags 供医生签核时注意，宁缺毋假。
