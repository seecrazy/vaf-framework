# 合同审查规则库（检索注入提示词；每条含规范依据，适用以现行法及个案为准）
entries:
  - id: liquidated_damages
    keywords: [违约金, 逾期, 每日, 百分比, 调减, 惩罚]
    text: 违约金条款（《民法典》第 585 条）：约定违约金过分高于造成的损失，可请求调减，
      司法实践常以损失的 30% 为过高参照；日息超 0.5‰~1‰ 量级或不对等倍率应标记高风险并列为谈判点。
  - id: jurisdiction
    keywords: [管辖, 法院, 仲裁, 争议解决, 所在地]
    text: 协议管辖（《民事诉讼法》第 35 条）：只能选择与争议有实际联系地点的法院
      （被告住所地/合同履行地/签订地/标的物所在地等）；约定对方所在地且我方异地应诉成本高的，
      建议 medium 风险并列谈判点（改为合同签订地或原告所在地）。
  - id: standard_terms
    keywords: [格式条款, 提示, 说明, 加黑, 显著]
    text: 格式条款（《民法典》第 496/497 条）：提供方须以显著方式提示与说明免除/减轻自身责任、
      加重对方责任、限制对方主要权利的条款，未提示的对方可主张该条款不成为合同内容；
      我方为接受方时须核查是否有提示痕迹。
  - id: termination
    keywords: [解除, 单方, 提前通知, 解除权,终止]
    text: 解除权对等性：仅一方享有任意解除权、或解除通知期不对等（如对方 90 天 vs 我方 30 天）
      属常见风险点；重大合同建议对等化修改。法定解除权（民法典 563 条）不因约定而排除。
  - id: confidentiality
    keywords: [保密, 机密, 知识产权, 保密期]
    text: 保密条款：无期限保密义务过重（建议重要技术秘密除外，一般信息 3~5 年）；
      知识产权归属缺失或归对方所有的定制开发场景应列为高风险谈判点。
  - id: liability_cap
    keywords: [赔偿, 上限, 责任限额, 连带]
    text: 赔偿上限：无赔偿上限 + 不可抗力除外缺失的组合对我方（弱势方）风险高；
      建议设为合同总额或年度费用额的合理倍数；"无限连带"表述须特别警惕。
  - id: auto_renewal
    keywords: [自动续约, 续期, 默认续, 期满]
    text: 自动续约：期满未异议即自动续约的条款须配退出窗口（不少于 30~60 天）与
      提醒义务；无退出窗口的自动续约建议标记 medium 风险。
  - id: payment_terms
    keywords: [付款, 结算, 账期, 预付款, 验收]
    text: 付款条款：预付款比例过高（>50%）且回款保障缺失、验收标准模糊导致付款条件
      被对方单方认定的，属商业高风险；建议绑定里程碑验收与对账机制。
  - id: ip_assignment
    keywords: [知识产权, 著作权, 成果, 归属, 许可]
    text: 知识产权归属：委托开发场景默认著作权归属需明确约定（民法典 843 条精神）；
      "全部成果归甲方且乙方不得复用通用组件"会摧毁乙方交付能力，属不对等条款。
  - id: force_majeure
    keywords: [不可抗力, 免责, 情势变更]
    text: 不可抗力与免责：缺不可抗力条款或范围过窄（仅列地震洪水）的，建议补充
      政府行为/疫情/供应链中断等情形及通知与减损义务（民法典 180/590 条）。
