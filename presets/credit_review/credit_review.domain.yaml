# =============================================================================
# 预置领域：credit_review 个人信贷预审（深度编排旗舰版，V2.8）
# -----------------------------------------------------------------------------
# 在 V2.3 基础上"编排用足"，示范全部核心原语：
#   retrieval（规则库检索注入）+ interaction（信息不足追问）+
#   router（预批大额转人工路由）+ human_review（大额人工复核）
# 知识依据不变（DTI 50%/征信 600/450/用途监管），阈值须按机构政策校准。
# =============================================================================
domain: credit_review
version: "2.0.0"
data_classification: sensitive

input:
  fields:
    - {name: loan_amount, type: float, required: true, min: 1000, max: 5000000, description: 申请金额（元）}
    - {name: term_months, type: int, required: true, min: 3, max: 120, description: 期限（月）}
    - {name: monthly_income, type: float, required: true, min: 0, description: 月收入（元）}
    - {name: monthly_debt_payment, type: float, required: true, min: 0, description: 现有月负债偿还额（元）}
    - {name: credit_score, type: int, min: 0, max: 1000, required: true, description: 第三方征信评分}
    - {name: employment, type: str, enum: [stable_employed, self_employed, contract, retired, unemployed], default: stable_employed}
    - {name: loan_purpose, type: str, required: true, description: 贷款用途}
    - {name: income_proof_note, type: str, required: false, description: 收入补充说明（失业/自雇场景用于澄清回答）}

outputs:
  decision:
    conclusion_enum: [pre_approved, manual_review, rejected]
    fields:
      - {name: dti_computed, type: float, description: 推算还款收入比}
      - {name: risk_factors, type: list, description: 风险因子清单}
      - {name: suggested_adjustments, type: list, description: 建议调整（降额/延长期限等）}

preprocessor:
  validators:
    - {type: range, field: monthly_income, low: 0, high: 10000000, level: fatal}
    - {type: range, field: credit_score, low: 0, high: 1000, level: warning}
  enrichers:
    - {type: retrieval, path: knowledge.yaml, top_k: 3, output_field: knowledge,
       query_fields: [loan_purpose, employment, credit_score, monthly_income, loan_amount]}

skills:
  - name: assess
    type: analysis
    output: decision
    prompt: |
      你是信贷预审员。申请信息：
      金额 {{ input.loan_amount }} 元 / {{ input.term_months }} 个月；
      月收入 {{ input.monthly_income }}，现有月偿债 {{ input.monthly_debt_payment }}；
      征信评分 {{ input.credit_score }}；就业 {{ input.employment }}；用途：{{ input.loan_purpose }}。
      收入补充说明：{{ input.income_proof_note }}（无=未提供）。
      澄清回答：{{ clarifications }}
      【检索到的适用规则】{{ enriched.knowledge }}

      预审规则（按序判定，适用规则优先）：
      1. 等额本息年利率 8% 推算月供与 DTI，写入 dti_computed；
      2. 用途违规（楼市/股市/理财）→ rejected；
      3. DTI≥0.50 → rejected；0.40~0.50 → manual_review + 降额/延展期建议；
      4. 征信<450 → rejected；450~600 → manual_review；
      5. unemployed 且无收入补充说明与澄清回答 → 结论 insufficient_data，
         追问收入来源/共同借款人（其余情况失业也至少 manual_review）；
      6. 以上均不命中 → pre_approved。
      风险因子逐条写 risk_factors；findings 引用输入数据作证据。

  - name: approval_guard
    type: audit
    output: decision
    veto_when: "output.conclusion == 'pre_approved' and output.confidence != 'high'"
    downgrade_to: manual_review
    confidence_after: medium

falsification_checkers:
  - {checker_id: credit_score_recheck, when: "input.credit_score < 450"}

pipeline:
  name: credit_review
  domain: credit_review
  version: "2.0.0"
  steps:
    # 交互澄清：assess 判定信息不足（失业无佐证等）→ 追问 → 重入评估
    - name: clarify_intake
      type: interaction
      skill: assess
      max_rounds: 1
      on_exhausted: degrade
    # 路由：小额预批直通（合成即终态）；大额预批必须人工复核
    - name: route_amount
      type: router
      depends_on: [clarify_intake]
      routes:
        - condition: "steps.clarify_intake.output.conclusion == 'pre_approved' and input.loan_amount > 1000000"
          go_to: senior_review
    - name: senior_review
      type: human_review
      depends_on: [route_amount]
      # 路由未选中本分支时表达式为假 → 步骤跳过（等价剪枝）
      trigger_condition: "routers.route_amount.selected == 'senior_review'"
      timeout_seconds: 86400
      on_timeout: reject          # 金融场景：超时保守拒绝
      review_fields: [conclusion, dti_computed, risk_factors]
      required_role: reviewer

result_from: clarify_intake
