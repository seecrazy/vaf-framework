# credit_review 规则库（检索节点知识源；每条 = 领域规则 + 依据，检索按关键词命中注入提示词）
entries:
  - id: dti_rule
    keywords: [dti, 还款收入比, 月收入, 月偿债, 负债, 期限, 金额]
    text: 还款收入比（DTI）规则：推算新增月供后 DTI=(现有月偿债+新增月供)/月收入；
      ≥0.50 拒绝；0.40~0.50 转人工并在建议中给出降额/延长期限方案；<0.40 通过线。
      审慎线 50% 为商业银行个人贷款常见口径，需按机构政策校准。
  - id: credit_score_rule
    keywords: [征信, 评分, credit_score, 逾期, 信用]
    text: 征信评分规则：第三方征信评分（0-1000 常见区间）<450 拒绝；450~600 转人工
      （需人工复核征信明细与逾期记录）；≥600 通过线。存在当前逾期直接拒绝。
  - id: purpose_rule
    keywords: [用途, purpose, 购房, 股市, 理财, 装修, 经营, 教育]
    text: 贷款用途监管规则：个人消费贷/经营贷资金不得流入楼市、股市、理财
      （个人贷款管理办法精神），违规用途直接拒绝并记录。
  - id: employment_rule
    keywords: [就业, employment, 失业, unemployed, 自雇, 退休]
    text: 就业稳定性规则：unemployed 且无其他收入证明 → 转人工（要求补充收入来源
      或共同借款人）；自雇人士收入核实需提供经营流水佐证。
  - id: amount_limit_rule
    keywords: [金额, 限额, loan_amount, 大额, 百万]
    text: 大额规则：申请金额超过机构单户限额（示例 100 万）的预批结论必须转人工
      审核复核；互联网贷款单户额度须符合监管上限要求。
  - id: multi_loan_signal
    keywords: [多头, 查询次数, 以贷养贷]
    text: 多头借贷信号：近期征信硬查询次数过多（示例阈值：3 个月 ≥6 次）提示多头
      风险，结论至少 manual_review 并在风险因子中注明。
