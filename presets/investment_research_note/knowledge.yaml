# 投研评审规则库（检索注入提示词；研究辅助，不构成投资建议）
entries:
  - id: earnings_quality
    keywords: [现金流, 净利, 扣非, 盈利质量, 背离]
    text: 盈利质量交叉验证：经营现金流净额 vs 扣非净利长期背离（比率 <0.7 连续
      两季）是核心预警；利润表权责发生制可调节，现金流更难粉饰。
  - id: goodwill_impairment
    keywords: [商誉, 减值, 并购, 业绩承诺]
    text: 商誉风险（《企业会计准则第 8 号——资产减值》）：商誉须每年减值测试；
      占总资产比例高（>20%）且标的业绩承诺临期的，减值风险集中释放。
  - id: receivables_signal
    keywords: [应收, 增速, 账期, 坏账]
    text: 应收账款信号：应收增速持续 2 倍于营收增速、或应收/营收占比趋势上升，
      提示放宽信用换收入或提前确认；关注坏账计提政策是否同行可比。
  - id: non_recurring
    keywords: [非经常性, 投资收益, 处置, 政府补助]
    text: 非经常性损益：处置股权/政府补助/公允价值变动撑起表观利润时，须还原
      扣非口径判断主业真实增长；扣非负增长而表观高增长的组合是典型风险形态。
  - id: valuation_fit
    keywords: [估值, DCF, PE, PB, EV, PS, 市销率]
    text: 估值方法适配：稳定现金流→DCF；盈利稳定同业可比→PE；重资产/金融→PB
      或 EV/EBITDA；亏损成长→PS。混用口径（亏损公司用 PE）是常见错误。
  - id: dual_high
    keywords: [存贷双高, 货币资金, 有息负债]
    text: 存贷双高：账面大额货币资金同时高息借款并存，资金真实性存疑
      （历史上多个造假案共性特征），须核查受限资金与利息收入匹配度。
  - id: disclosure_check
    keywords: [披露, 公告, 更正, 快报]
    text: 披露核查：业绩快报为初步核算未经审计，与正式年报数字可能修正；
      依据快报做多空判断须标注口径；出现更正公告的须重算全部比率。
  - id: research_compliance
    keywords: [投资建议, 免责, 合规, 目标价]
    text: 研究合规：输出为研究辅助材料，不构成投资建议、不给目标价与买卖评级；
      结论必须引用输入数据并可溯源（sources 分级：公告 L1 / 转述 L2）。
