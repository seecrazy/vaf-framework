[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaf"
version = "2.0.0"
description = "VAF 2.0 — Vertical Agent Framework: reliability skeleton for domain agents (contracts, deterministic preprocessing, testable skills, orchestrated runtime)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.5,<3", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
vaf = "vaf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
